[package]
name = "cyberscope"
version = "0.1.0"
edition = "2024"
description = "A multi-source internet asset intelligence console with an embedded web frontend"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
csv = "1.3"
dotenvy = "0.15"
futures-util = "0.3"
ipnet = "2.11"
mime_guess = "2.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls", "stream"] }
rustix = { version = "1.1", features = ["process"] }
secrecy = "0.10.3"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "macros", "migrate", "runtime-tokio-rustls", "sqlite", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "trace"] }
rust-embed = { version = "8.7", features = ["compression"] }
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v4"] }

[dev-dependencies]
pretty_assertions = "1.4"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
